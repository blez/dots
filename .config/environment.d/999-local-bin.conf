# PATH for systemd user services and everything they start (environment.d(5)).
# xdg-desktop-portal launches the folder handler (yazi.desktop) and the file
# dialog (termfilechooser -> yazi-wrapper.sh) with this environment, and yazi
# lives in ~/.local/bin (installed by setup.sh).
# Files apply in filename order across all environment.d dirs, and Ubuntu's
# /usr/lib/environment.d/99-environment.conf (-> /etc/environment) sets PATH
# outright, so this one has to sort after it (and after 990-snapd.conf).
PATH=$HOME/.local/bin:$PATH
