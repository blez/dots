# picom v13 configuration.
# Reference: https://picom.app (or the picom.1.adoc man page source upstream).
# Test which rules match a window with: picom-inspect

#################################
#            Backend            #
#################################

backend = "glx";
vsync = true;
# Damage tracking off on purpose (dotfiles commit bae7e34, 2026-09-19).
use-damage = false;
log-level = "warn";

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
#      Defaults (all windows)   #
#################################

corner-radius = 12;

shadow = true;
shadow-radius = 12;
# v13 fixed shadow-opacity being applied twice; 0.16 matches the old 0.4.
shadow-opacity = 0.16;
shadow-offset-x = -15;
shadow-offset-y = -15;

fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;
fade-delta = 10;

frame-opacity = 1.0;

# Background blur is not enabled (blur-background stays false); these only
# define how it would look if a rule set blur-background = true.
blur: {
  method = "dual_kawase";
  strength = 6;
}

#################################
#         Window rules          #
#################################

# Rules apply top to bottom; for each option the last matching rule wins.
# They replace wintypes, opacity-rule and the *-exclude options.
rules = (
  # Former wintypes: shadows also under transparent parts of windows.
  { match = "window_type = 'normal'  || window_type = 'menu'    || "
            "window_type = 'popup_menu' || window_type = 'utility' || "
            "window_type = 'toolbar'";
    full-shadow = true; },
  { match = "window_type = 'tooltip'"; shadow = false; },
  { match = "window_type = 'dock' || window_type = 'dnd'"; shadow = false; },
  { match = "window_type = 'notification'"; opacity = 1; },

  # Former shadow-exclude.
  { match = "name = 'Notification'   || "
            "class_g = 'Conky'       || "
            "class_g ?= 'Notify-osd' || "
            "class_g = 'Cairo-clock' || "
            "class_g = 'slop'        || "
            "class_g = 'Polybar'     || "
            "class_g = 'Dunst'       || "
            "class_g = 'xmobar'";
    shadow = false; },

  # Former fade-exclude.
  { match = "class_g = 'Rofi'"; fade = false; },

  # Former rounded-corners-exclude, plus fullscreen (no longer automatic).
  { match = "name = 'Notification area' || "
            "class_g = 'Polybar'          || "
            "class_g = 'code-oss'         || "
            "class_g = 'firefox'          || "
            "class_g = 'Thunderbird'      || "
            "fullscreen";
    corner-radius = 0; },

  # Former opacity-rule.
  { match = "name = 'Dunst'"; opacity = 1; },
  { match = "class_g = 'eww-blur_full'"; opacity = 0.1; },
  { match = "class_g = 'Tint2'"; opacity = 1; },

  # Former blur-background-exclude (kept for when blur is enabled).
  # slop: https://github.com/naelstrof/maim/issues/130
  { match = "class_g = 'dwm' || class_g = 'slop'"; blur-background = false; },

  # Retiling animation: normal (managed) windows glide to their new size and
  # position when xmonad retiles them. Scoped here, not global, so Rofi,
  # tooltips and menus don't stretch on every resize. Fullscreen toggles switch
  # instantly. Open/close keep fading.
  { match = "window_type = 'normal' && !override_redirect && !fullscreen";
    animations = (
      {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.15;
      }
    ); },
);
