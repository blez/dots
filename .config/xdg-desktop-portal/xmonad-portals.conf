# xdg-desktop-portal: which backend implements each portal interface. The
# portal reads this file because XDG_CURRENT_DESKTOP is XMonad (portals.conf(5)).
# Everything stays with the GTK backend, which the portal picked on its own
# before this file existed; only the file dialogs ("Save as", "Open file" in
# Chrome and other portal-aware apps) go to termfilechooser, which runs yazi in
# an alacritty window (built by setup.sh, configured in
# ~/.config/xdg-desktop-portal-termfilechooser).
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser
