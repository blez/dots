# Keys of yazi as a file dialog (plugin chooser, started by
# ~/.config/xdg-desktop-portal-termfilechooser/yazi-wrapper.sh): q and Esc
# cancel, Ctrl+S saves here or picks this folder, a saves under a typed name.
# Outside a dialog the keys keep their usual meaning (the plugin's --fallback).
[[mgr.prepend_keymap]]
on   = "q"
run  = "plugin chooser -- cancel --fallback=quit"
desc = "Quit (in a file dialog: cancel)"

[[mgr.prepend_keymap]]
on   = "<Esc>"
run  = "plugin chooser -- cancel --fallback=escape"
desc = "Exit visual mode, clear selection (in a file dialog: cancel)"

[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = "plugin chooser -- confirm"
desc = "In a file dialog: save here / choose this folder"

[[mgr.prepend_keymap]]
on   = "a"
run  = "plugin chooser -- name"
desc = "Create a file (in a save dialog: save under a typed name)"

# Open shell with '!'
[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# Enter directory or open file with 'l'
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Enter directory or open file with '<Enter>'
[[mgr.prepend_keymap]]
on   = [ "<Enter>" ]
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Paste into hovered directory with 'p'
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"
[[mgr.prepend_keymap]]
on   = "<A-t>"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = [ "\\" ]
run = [
    "plugin split-tabs spl_toggle",
    "plugin split-tabs spl_preview"
]
desc = "Split-tabs: toggle split tabs mode"
[[mgr.prepend_keymap]]
on = "<Tab>"
run = "plugin split-tabs spl_switch_tab"
desc = "Split-tabs: switch to the other pane"
[[mgr.prepend_keymap]]
on = "<A-p>"
run = "plugin split-tabs spl_preview"
desc = "Split-tabs: toggle preview pane"
[[mgr.prepend_keymap]]
on   = [ "<F5>" ]
run  = [
    "yank",
    "plugin split-tabs spl_switch_tab",
    "paste",
    "plugin split-tabs spl_switch_tab"
]
desc = "Copy to the other pane without staying there"
[[mgr.prepend_keymap]]
on   = [ "<F6>" ]
run  = [
    "yank --cut",
    "plugin split-tabs spl_switch_tab",
    "paste",
    "plugin split-tabs spl_switch_tab"
]
desc = "Move to the other pane without staying there"

# <Tab> belongs to split-tabs, so the file info popup (spot) moves to I.
[[mgr.prepend_keymap]]
on   = "I"
run  = "spot"
desc = "Spot hovered file (type, size, dimensions)"

[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Mount, unmount or eject drives"

[[mgr.prepend_keymap]]
on   = "C"
run  = "plugin ouch"
desc = "Compress selected files (format from the name, zip by default)"
