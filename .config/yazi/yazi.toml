[opener]
play = [
    { run = 'vlc "$@"', orphan = true, for = "unix" },
]
emacs-edit = [
    { run = 'emacsclient -nw -a "" -s ~/.emacs.d/server/server "$@"', block = true, for = "unix" }
]

[open]
prepend_rules = [
    { mime = "video/*", use = "play" },
    { mime = "text/*", use = "emacs-edit" },
]

[mgr]
show_hidden = false

[tasks]
# Don't count preview preloaders (PDF/image thumbnails of the current folder)
# as unfinished work: otherwise q asks "quit anyway?" in a folder full of
# PDFs, e.g. every time a file dialog is quit in ~/Downloads.
suppress_preload = true
